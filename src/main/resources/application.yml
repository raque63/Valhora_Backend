spring:
  application:
    name: valhora-backend
  datasource:
    url: jdbc:postgresql://localhost:5433/valhora
    username: valhora
    password: valhora
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_APP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  address: 0.0.0.0
  port: ${PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://192.168.100.10:5173
  security:
    secure-cookies: false
  jwt:
    secret: ${JWT_SECRET:CHANGE_THIS_SECRET_IN_YOUR_LOCAL_ENV_FILE_TO_A_LONG_RANDOM_VALUE}
    access-token-expiration-ms: 900000
    refresh-token-expiration-ms: 604800000
  seed:
    enabled: true
    create-admin: true
    admin-email: ${SEED_ADMIN_EMAIL:admin@valhora.com}
    admin-password: ${SEED_ADMIN_PASSWORD:AdminValhora123}
  notifications:
    admin-email: ${ADMIN_NOTIFICATION_EMAIL:valhoracr@gmail.com}
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  whatsapp:
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    access-token: ${WHATSAPP_ACCESS_TOKEN:}
    admin-number: ${WHATSAPP_ADMIN_NUMBER:50683830121}
    template-name: ${WHATSAPP_TEMPLATE_NAME:nuevo_pedido_valhora}
    language-code: ${WHATSAPP_LANGUAGE_CODE:es}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
