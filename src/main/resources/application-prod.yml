# Perfil de producción. Se activa con SPRING_PROFILES_ACTIVE=prod.
# Los valores sin default (${VAR} sin :) obligan a definir la variable de entorno;
# si falta alguna, la app falla al arrancar en vez de arrancar mal configurada.
spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  security:
    secure-cookies: true
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-ms: 900000
    refresh-token-expiration-ms: 604800000
  seed:
    enabled: ${SEED_ENABLED:false}
    create-admin: ${CREATE_ADMIN:false}
    admin-email: ${SEED_ADMIN_EMAIL:}
    admin-password: ${SEED_ADMIN_PASSWORD:}
  frontend-base-url: ${FRONTEND_BASE_URL:https://valhoracollection.com}
